name: maatriwatch_patient_app
description: MaatriWatch Android-first patient companion prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.5.6
  firebase_core: ^4.13.0
  firebase_database: ^12.4.7
  firebase_messaging: ^16.1.1
  # 12.3.0 fixes Android Gradle Plugin 9 registration/build compatibility.
  file_picker: ^12.3.0
  http: ^1.6.0
  record: ^6.2.1
  web: ^1.1.1
  webview_flutter: ^4.13.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
