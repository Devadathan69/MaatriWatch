name: maatriwatch_clinician_dashboard
description: MaatriWatch clinician dashboard for web and tablet.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  maatriwatch_patient_app:
    path: ../patient_app
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.6
  firebase_core: ^4.13.0
  firebase_database: ^12.4.7
  fl_chart: ^1.2.0
  http: ^1.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
