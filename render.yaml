# Free internet testing: inactivity sleep stops reminders/SOS workers too.
# Supabase and Firebase remain the existing persistent services.
services:
  - type: web
    name: maatriwatch-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_IN_MEMORY
        value: "false"
      - key: ALLOW_UNVERIFIED_PATIENT_DEMO
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_AUTH_ACTION_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-5-mini
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-transcribe
      - key: MAX_CONTENT_LENGTH
        value: "4000000"
      - key: REPORT_UPLOAD_MAX_BYTES
        value: "4000000"
      - key: TELEMETRY_MAX_CONTENT_LENGTH
        value: "16384"
      - key: DAILY_API_KEY
        value: ""
